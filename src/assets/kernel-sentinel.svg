<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Emerald / Green Glow for Rubric Requisite C -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Cyan / Blue Accents -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Crimson Core Accent -->
    <linearGradient id="crimsonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="telemetryGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="12" fill="url(#telemetryGrid)"/>

  <!-- Orbital Rings -->
  <g transform="translate(400, 250)">
    <!-- Outer Radar Ring -->
    <circle r="190" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle r="150" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" stroke-dasharray="12 4"/>
    <circle r="105" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Orbital Crosshairs -->
    <line x1="-220" y1="0" x2="-195" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="195" y1="0" x2="220" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="-220" x2="0" y2="-195" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="195" x2="0" y2="220" stroke="#38bdf8" stroke-width="2"/>

    <!-- Data Conduits (Circuit Tracks) -->
    <path d="M -150 -60 L -90 -60 L -50 -20" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none"/>
    <circle cx="-150" cy="-60" r="3" fill="#38bdf8"/>
    
    <path d="M 150 -60 L 90 -60 L 50 -20" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.5" fill="none"/>
    <circle cx="150" cy="-60" r="3" fill="#10b981"/>

    <path d="M -150 60 L -80 60 L -40 20" stroke="rgba(239, 68, 68, 0.5)" stroke-width="1.5" fill="none"/>
    <circle cx="-150" cy="60" r="3" fill="#ef4444"/>

    <path d="M 150 60 L 80 60 L 40 20" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none"/>
    <circle cx="150" cy="60" r="3" fill="#38bdf8"/>

    <!-- Rotating Pulse Arc -->
    <path d="M -150 0 A 150 150 0 0 1 0 -150" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#greenGlow)"/>

    <!-- Central Hexagonal Sentinel Core -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="#090d16" stroke="url(#cyanBlueGrad)" stroke-width="2.5" filter="url(#coreGlow)"/>
    
    <!-- Inner Security Shield Icon -->
    <path d="M 0 -35 L 26 -22 L 26 5 C 26 22 0 35 0 35 C 0 35 -26 22 -26 5 L -26 -22 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Heartbeat / Telemetry Pulse within Shield -->
    <path d="M -14 6 L -7 6 L -3 -6 L 2 12 L 6 -2 L 9 6 L 14 6" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Orbital Node Badges -->
    <!-- Node Alpha: Online -->
    <g transform="translate(-170, -110)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#0b1324" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1"/>
      <circle cx="-22" cy="0" r="3" fill="#10b981"/>
      <text x="-12" y="4" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" font-weight="600">NODE.01</text>
    </g>

    <!-- Node Beta: Sentinel Guard -->
    <g transform="translate(170, -110)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#0b1324" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1"/>
      <circle cx="-22" cy="0" r="3" fill="#38bdf8"/>
      <text x="-12" y="4" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="600">KERNEL</text>
    </g>

    <!-- Node Gamma: Latency 1.2ms -->
    <g transform="translate(170, 110)">
      <rect x="-38" y="-12" width="76" height="24" rx="4" fill="#0b1324" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" font-weight="600">1.2ms RTT</text>
    </g>

    <!-- Node Delta: Threat Score 0.00 -->
    <g transform="translate(-170, 110)">
      <rect x="-38" y="-12" width="76" height="24" rx="4" fill="#0b1324" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <circle cx="-25" cy="0" r="3" fill="#ef4444"/>
      <text x="-15" y="4" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f87171" font-weight="600">SEC.LOCK</text>
    </g>
  </g>

  <!-- Technical Overlay HUD / Telemetry Meta (Top-Left & Top-Right) -->
  <text x="32" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1">KSHIELD // TOPOLOGY MESH</text>
  <text x="32" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DIAGNOSTIC PROTOCOL: SCSS-ARCH-V2</text>

  <text x="768" y="42" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" font-weight="600">● 99.98% COHERENCE</text>
  <text x="768" y="60" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">PORT: 443 | HOST: LOCAL_DEV</text>

  <!-- Bottom Coordinates Footer -->
  <line x1="32" y1="460" x2="768" y2="460" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="32" y="478" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">CLUSTER: DAM-0488-NEBRIJA</text>
  <text x="400" y="478" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">AUTOR: LUIS LÁZARO PIMENTEL</text>
  <text x="768" y="478" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">RUBRIC REQ: BORDER 3PX SOLID GREEN</text>
</svg>
